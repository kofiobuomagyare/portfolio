    <script>
      // Set the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("koa-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
      // Same idea for language: stored preference, else the OS language.
      try {
        var langs = ["en", "fr", "es", "pt", "nl", "ar", "zh", "ja", "sw", "tw", "ak", "ga", "ee", "ha", "yo", "ig", "pcm", "gpe", "am", "zu"];
        var l = localStorage.getItem("koa-lang");
        if (langs.indexOf(l) === -1) {
          var sys = (navigator.language || "en").split("-")[0].toLowerCase();
          l = langs.indexOf(sys) !== -1 ? sys : "en";
        }
        document.documentElement.lang = l;
        document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
